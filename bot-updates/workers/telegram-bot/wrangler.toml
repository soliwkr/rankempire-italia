# wrangler.toml aggiornato per rank-rent-bot-chris
# Copiare in workers/telegram-bot/wrangler.toml nel repo telegram-ranketogram.
# Rimuovere OPENROUTER_API_KEY (non più usato).

name = "rank-rent-bot-chris"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
FACTORY_API_URL = "https://factory-core.soliwkr.workers.dev"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "R2_SCOUT"
bucket_name = "scout-photos"

# Secrets da impostare con: wrangler secret put <NAME>
# BOT_TOKEN          - token bot Telegram
# GOOGLE_SERVICE_ACCOUNT - JSON key service account GCP (per Vertex AI)
# GCP_PROJECT        - es. "my-gcp-project-id"
# GCP_LOCATION       - es. "us-central1"
# GEMINI_MODEL       - es. "gemini-1.5-flash-001"
# FACTORY_API_SECRET - Bearer token per factory-core API
